<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa Salva">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Caixa Salva</title>
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e7e7e2;
  --accent:#fbe58a;--accent-edge:#ecd466;--accent-ink:#1c1c1a;--accent-soft:#fff9e3;--accent-text:#6e5800;--fab-bg:#fdecaf;--fab-edge:#f1e2a6;
  --danger:#b3261e;--danger-soft:#fbe7e5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141414;--surface:#1f1f1e;--ink:#f3f3f0;--muted:#a3a39c;--line:#2f2f2c;
    --accent:#f3dc7a;--accent-edge:#f3dc7a;--accent-ink:#1c1c1a;--accent-soft:#2b2711;--accent-text:#f0da86;--fab-bg:#e9db93;--fab-edge:#e9db93;
    --danger:#ff8f86;--danger-soft:#3a1b19;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141414;--surface:#1f1f1e;--ink:#f3f3f0;--muted:#a3a39c;--line:#2f2f2c;
  --accent:#f3dc7a;--accent-edge:#f3dc7a;--accent-ink:#1c1c1a;--accent-soft:#2b2711;--accent-text:#f0da86;--fab-bg:#e9db93;--fab-edge:#e9db93;
  --danger:#ff8f86;--danger-soft:#3a1b19;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;background:var(--bg)}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.top-btn{border:0;background:transparent;color:var(--accent-text);font-weight:600;padding:10px 4px;min-height:44px}
main{padding:0 16px 130px;max-width:720px;margin:0 auto}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;padding:9px 8px;border-radius:9px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card.pad{padding:14px}
.card h3{margin:0 0 8px;font-size:15px}
.card h3::first-letter{text-transform:uppercase}
.alert{border-color:transparent;background:var(--danger-soft);padding:12px 12px 6px}
.alert-title{font-weight:700;color:var(--danger);margin:0 4px 6px}
.soft{border-color:transparent;background:var(--accent-soft);padding:12px 14px}
.soft p{margin:0 0 10px;font-size:14px}
.row-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;border-radius:10px;background:var(--surface);padding:11px 12px;margin:0 0 6px;text-align:left;min-height:46px}
.row-btn small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.row-btn b{font-variant-numeric:tabular-nums;white-space:nowrap}
.row-btn:active{background:var(--accent-soft)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:15px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td.name{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
tbody tr{cursor:pointer}
tbody tr:active{background:var(--accent-soft)}
tfoot td{font-weight:700;border-bottom:0;background:var(--accent-soft);padding-top:14px;padding-bottom:14px;font-size:14px}
td.late{color:var(--danger);font-weight:700}
td.today{color:var(--danger);font-weight:700}
.note{color:var(--muted);font-size:12px;margin:-4px 4px 12px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;border:1px solid var(--fab-edge);background:var(--fab-bg);color:var(--accent-ink);font-weight:600;padding:15px 26px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.09);min-height:52px;white-space:nowrap}
.fab:active{filter:brightness(.92)}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h2{margin:0;font-size:20px;letter-spacing:-.01em}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.icon-btn:active{background:var(--line)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px}
input,select{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid var(--accent-text);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loan-box{background:var(--accent-soft);border-radius:14px;padding:14px 14px 2px;margin:6px 0 14px}
.preview{font-size:14px;font-weight:600;color:var(--accent-text);margin:-2px 0 12px}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:0 0 10px;min-height:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;padding:10px 14px;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent-edge);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.link{border:0;background:transparent;color:var(--muted);min-height:38px;font-weight:500;font-size:14px}
.stack{display:grid;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:15px;margin:6px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);vertical-align:middle;margin-left:6px}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.done{text-align:center;padding:6px 0 16px}
.done .check{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:28px;font-weight:700;margin:4px auto 10px}
.ck{width:76px;height:76px;display:block;margin:6px auto 12px;overflow:visible}
.ck-c{fill:var(--accent)}
.ck-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.ck-p{fill:none;stroke:var(--accent-ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:0}
.wait{visibility:hidden}
.play .ck{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.play .ck-ring{animation:ring .8s .15s ease-out both}
.play .ck-p{stroke-dashoffset:36;animation:draw .45s .25s ease-out forwards}
.play h2,.play p{animation:fade .45s .4s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.play .ck,.play .ck-ring,.play .ck-p,.play h2,.play p{animation:none}.play .ck-p{stroke-dashoffset:0}}
.done h2{margin:0 0 6px}
.done p{margin:4px 0}
.help{font-size:13px;color:var(--muted);margin:6px 0 14px}

/* alerta compacto, busca, filtro e histórico da pessoa */
.alert-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.alert-head span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.more-btn{display:block;width:100%;border:0;background:transparent;color:var(--danger);font-weight:700;font-size:15px;padding:8px 12px 12px;min-height:44px}
.search{position:relative;margin:0 0 12px}
.search input{margin-top:0;padding-right:44px}
.search input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:1px;top:1px;width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--danger);border-radius:999px;background:var(--danger-soft);color:var(--danger);font-weight:700;font-size:13px;padding:6px 14px;margin:0 0 10px;min-height:36px}
#sub-seg{scroll-margin-top:76px}
#suggest,#suggest-ind{margin:-2px 0 8px}
#suggest:empty,#suggest-ind:empty{display:none}
.sug{border:1px solid var(--line)}
.card details{margin-top:2px}
.card summary{cursor:pointer;color:var(--accent-text);font-weight:600;font-size:14px;padding:10px 4px;min-height:44px}

/* confirmation dialog (replaces native confirm/alert) */
.dlg-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:40;animation:fade .15s}
.dlg{background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg h3{margin:0;font-size:18px;line-height:1.3}
.dlg p{margin:8px 0 0;color:var(--muted);font-size:15px;white-space:pre-line}
.dlg .stack{margin-top:18px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head h2{font-size:18px;margin:0}
.cal-head h2::first-letter{text-transform:uppercase}
.cal-head .grp{display:flex;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.cell{border:0;border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;min-height:56px}
.cell.empty{background:transparent}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent-text)}
.cell.sel{background:var(--accent);color:var(--accent-ink)}
.dot{font-style:normal;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);padding:0 5px}
.dot.late{background:var(--danger-soft);color:var(--danger)}
.dot.today{background:var(--danger-soft);color:var(--danger)}
.dot.ph{visibility:hidden}
.cell.sel .dot{background:var(--accent-ink);color:var(--accent)}
.month-sum{font-size:13px;color:var(--muted);margin:0 2px 12px}
.card.earn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin:2px 0 12px}
.earn-main span{display:block;color:var(--muted);font-size:13px;font-weight:600}
.earn-main b{display:block;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.earn-parts{display:grid;gap:3px;font-size:13px}
.earn-parts div{display:flex;justify-content:space-between;gap:12px}
.earn-parts span{color:var(--muted)}
.earn-parts b{font-variant-numeric:tabular-nums;white-space:nowrap}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:30;font-size:14px;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* celebração ao quitar um empréstimo: fogos de artifício de 🤑💰💸 */
.win{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;color:#fff;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 50% 40%,#1c1c1c 0,#000 68%);animation:win-in .3s ease-out both}
.win.out{animation:win-out .35s ease-in both}
@keyframes win-in{from{opacity:0}to{opacity:1}}
@keyframes win-out{to{opacity:0}}
.win-sky{position:absolute;inset:0;z-index:1;pointer-events:none}
.win-card{position:relative;z-index:2;width:min(340px,86vw);display:flex;flex-direction:column;align-items:center;text-align:center}
.win-photo{width:196px;height:246px;animation:win-pop .8s cubic-bezier(.3,1.5,.5,1) .15s both}
.win-photo img{width:100%;height:100%;display:block;border-radius:30px;object-fit:cover;background:#123;
  border:5px solid #ffd23f;box-shadow:0 0 0 6px rgba(255,210,63,.25),0 0 50px rgba(255,200,0,.55);animation:win-float 2.4s ease-in-out 1s infinite}
@keyframes win-pop{0%{opacity:0;transform:scale(0) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes win-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.win-name{margin-top:22px;font-weight:700;font-size:21px;animation:win-rise .5s ease-out .6s both}
.win-amount{font-weight:900;font-size:40px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 0 24px rgba(255,214,64,.8),0 3px 0 rgba(0,0,0,.35);animation:win-rise .5s ease-out .8s both}
.win-sub{font-size:14px;color:rgba(255,255,255,.8);animation:win-rise .5s ease-out .95s both}
.win-tap{margin-top:26px;font-size:12px;color:rgba(255,255,255,.55);animation:win-rise .5s ease-out 2.2s both}
@keyframes win-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fw{position:absolute;width:0;height:0}
.fw i{position:absolute;left:0;top:0;font-style:normal;line-height:1}
.fw-rocket{left:-2px !important;width:4px;height:24px;border-radius:2px;background:linear-gradient(#fff,rgba(255,214,64,0));animation:fw-rise .55s cubic-bezier(.3,.6,.5,1) both}
@keyframes fw-rise{0%{transform:translateY(var(--rise));opacity:1}85%{opacity:1}100%{transform:translateY(0);opacity:0}}
.fw-flash{left:-60px !important;top:-60px !important;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,235,150,.8),rgba(255,214,64,0) 70%);opacity:0;animation:fw-flash .7s ease-out .5s both}
@keyframes fw-flash{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.fw-e{opacity:0;animation:fw-out 2.4s .5s both}
@keyframes fw-out{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2);animation-timing-function:cubic-bezier(.1,.75,.3,1)}
  6%{opacity:1}
  45%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 200px)) scale(.8) rotate(calc(var(--r) * 1.6))}}
.fw-s{width:5px;height:5px;border-radius:50%;opacity:0;animation:fw-spark 1.5s .5s both}
@keyframes fw-spark{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4);animation-timing-function:cubic-bezier(.1,.75,.3,1)}
  8%{opacity:1}
  55%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);animation-timing-function:ease-in}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 70px)) scale(.4)}}
.win.calm *{animation:none !important}
@media (max-height:700px){.win-photo{width:140px;height:176px}.win-amount{font-size:34px}}
</style>
</head>
<body>
<header class="top">
  <h1>Caixa Salva</h1>
  <button class="top-btn" data-act="settings">Ajustes</button>
</header>

<main>
  <div id="banners"></div>

  <div class="seg" id="main-seg">
    <button data-act="view" data-v="list">Lista</button>
    <button data-act="view" data-v="cal">Calendário</button>
  </div>

  <section id="view-list">
    <div class="seg" id="sub-seg">
      <button data-act="filter" data-f="active">Em aberto</button>
      <button data-act="filter" data-f="paid">Quitados</button>
    </div>
    <div class="search" id="search" hidden>
      <input id="q" type="search" placeholder="Buscar por nome" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar por nome">
      <button class="clear" data-act="q-clear" aria-label="Limpar busca" hidden>✕</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-cal" hidden>
    <div id="cal"></div>
  </section>
</main>

<button class="fab" data-act="new">+ Novo empréstimo</button>
<div id="sheet-root"></div>
<div id="dialog-root"></div>
<div id="toast" role="status"></div>

<script>
'use strict';

/* ---------- Constantes e estado ---------- */
var STORE_KEY = 'emprestimos.v1';
var RATE = 30; // juros fixos de 30 % por mês
var db = { version: 1, loans: [], settings: { reminderHour: 9, lastBackup: null } };
var view = 'list', filter = 'active';
var query = '', lateOnly = false;   // busca por nome e filtro "só atrasados"
var calM = null, calSel = null;
var PREVIEW = false; // a versão de pré-visualização dentro do Claude troca isto para true

/* ---------- Utilitários ---------- */
function $(s, el) { return (el || document).querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad(n) { return String(n).padStart(2, '0'); }
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function find(id) { return db.loans.find(function (l) { return l.id === id; }); }

/* ---------- Datas (sempre strings AAAA-MM-DD, hora local) ---------- */
function isoDate(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
function parseISO(s) { var p = s.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
function todayISO() { var t = new Date(); return isoDate(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
function tsToISO(ts) { var t = new Date(ts); return isoDate(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
// "um mês depois" (limitado ao fim do mês); com minusDay, um dia a menos
function monthLater(s, minusDay) {
  var p = parseISO(s);
  var y = p.y, m = p.m + 1;
  if (m > 12) { m = 1; y++; }
  var dim = new Date(y, m, 0).getDate();
  var d = Math.min(p.d, dim) - (minusDay ? 1 : 0);
  var t = new Date(y, m - 1, d);
  return isoDate(t.getFullYear(), t.getMonth() + 1, t.getDate());
}
function reminderDate(s) { return monthLater(s, true); }  // ex.: 10/11 -> 09/12
function dueDate(s) { return monthLater(s, false); }      // ex.: 10/11 -> 10/12
function diffDays(a, b) {
  var x = parseISO(a), y = parseISO(b);
  return Math.round((Date.UTC(y.y, y.m - 1, y.d) - Date.UTC(x.y, x.m - 1, x.d)) / 864e5);
}
function fmtShort(s) { var p = parseISO(s); return pad(p.d) + '/' + pad(p.m); }
function fmtFull(s) { var p = parseISO(s); return pad(p.d) + '/' + pad(p.m) + '/' + p.y; }
function fmtLong(s) {
  var p = parseISO(s);
  return new Date(p.y, p.m - 1, p.d).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

/* ---------- Dinheiro (guardado em centavos) ---------- */
function brl(c) { return (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function num(c) { return (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function loanTotal(l) { return Math.round(l.valor * (100 + (l.taxa == null ? RATE : l.taxa)) / 100); }
function loanInterest(l) { return loanTotal(l) - l.valor; }   // os 30 %: o que o empréstimo rende
function fullName(l) { return ((l.nome || '') + ' ' + (l.sobrenome || '')).trim(); }
function byReminder(a, b) {
  var x = reminderDate(a.date), y = reminderDate(b.date);
  return x < y ? -1 : x > y ? 1 : 0;
}
function byDateDesc(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  return (b.createdAt || 0) - (a.createdAt || 0);
}

/* ---------- Pessoas (deduzidas dos empréstimos, nada é guardado a mais) ---------- */
// Chave da pessoa: CPF completo; sem CPF, nome + sobrenome sem acento nem maiúsculas.
// Um empréstimo antigo sem CPF é ligado ao CPF da pessoa de mesmo nome, se esse nome tem um único CPF.
function normName(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
}
function cpfDigits(s) { var d = String(s || '').replace(/\D/g, ''); return d.length === 11 ? d : ''; }
function personKeyer() {
  var nameCpf = {};
  db.loans.forEach(function (l) {
    var c = cpfDigits(l.cpf); if (!c) return;
    var n = normName(fullName(l));
    nameCpf[n] = (nameCpf[n] === undefined || nameCpf[n] === c) ? c : '';
  });
  return function (l) {
    var c = cpfDigits(l.cpf);
    if (c) return 'cpf:' + c;
    var n = normName(fullName(l));
    return nameCpf[n] ? 'cpf:' + nameCpf[n] : 'nome:' + n;
  };
}
function peopleList() {
  var keyOf = personKeyer(), map = {}, list = [];
  db.loans.forEach(function (l) {
    var k = keyOf(l), p = map[k];
    if (!p) { p = map[k] = { key: k, loans: [] }; list.push(p); }
    p.loans.push(l);
  });
  list.forEach(function (p) { p.loans.sort(byDateDesc); p.last = p.loans[0]; });
  return list;
}
function personOf(l) {
  var k = personKeyer()(l);
  return peopleList().filter(function (p) { return p.key === k; })[0];
}
// Dados para um novo empréstimo: identidade mais recente preenchida + valor do último empréstimo
function prefillFor(p) {
  var pre = { nome: p.last.nome, sobrenome: p.last.sobrenome, valor: p.last.valor };
  ['cpf', 'phone', 'endereco', 'profissao', 'indicacao', 'salario'].forEach(function (k) {
    for (var i = 0; i < p.loans.length; i++) { if (p.loans[i][k]) { pre[k] = p.loans[i][k]; break; } }
  });
  return pre;
}
// Pessoas com algum empréstimo vencido (lembrete de hoje ou antes), a mais antiga primeiro
function lateGroups(t) {
  var keyOf = personKeyer(), map = {}, list = [];
  db.loans.forEach(function (l) {
    if (l.status === 'paid' || reminderDate(l.date) > t) return;
    var k = keyOf(l), g = map[k];
    if (!g) { g = map[k] = { key: k, loans: [], total: 0 }; list.push(g); }
    g.loans.push(l); g.total += loanTotal(l);
  });
  list.forEach(function (g) { g.loans.sort(byReminder); });
  list.sort(function (a, b) { return byReminder(a.loans[0], b.loans[0]); });
  return list;
}
function loanRow(l) {
  var paid = l.status === 'paid';
  var sub = paid ? (l.paidAt ? 'quitado em ' + fmtFull(l.paidAt) : 'quitado') : 'em aberto · lembrete ' + fmtShort(reminderDate(l.date));
  return '<button class="row-btn" data-act="detail" data-id="' + l.id + '"><span>' + fmtFull(l.date) + ' · ' + brl(l.valor) + '<small>' + sub + '</small></span><b>' + brl(loanTotal(l)) + '</b></button>';
}

/* ---------- Armazenamento local ---------- */
function load() {
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return; }
  if (!raw) return;
  try {
    var p = JSON.parse(raw);
    db = {
      version: 1,
      loans: Array.isArray(p.loans) ? p.loans : [],
      settings: Object.assign({ reminderHour: 9, lastBackup: null }, p.settings || {})
    };
  } catch (e) {
    try { localStorage.setItem(STORE_KEY + '.corrupt', raw); } catch (_) {}
    notice('Dados ilegíveis', 'Não consegui ler os dados salvos. Uma cópia foi guardada. Se precisar, restaure um backup em Ajustes.');
  }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { notice('Não salvou', 'Não foi possível salvar os dados neste aparelho. Verifique o espaço e se a navegação privada está desligada.'); }
}

/* ---------- Toast ---------- */
var toastTimer = null;
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ---------- Diálogo de confirmação (no lugar de confirm/alert) ---------- */
function askConfirm(opt) {
  return new Promise(function (resolve) {
    var root = $('#dialog-root');
    root.innerHTML = '<div class="dlg-back"><div class="dlg" role="alertdialog" aria-modal="true"><h3>' + esc(opt.title) + '</h3>' +
      (opt.text ? '<p>' + esc(opt.text) + '</p>' : '') +
      '<div class="stack"><button class="btn ' + (opt.danger ? 'danger' : 'primary') + '" data-dlg="ok">' + esc(opt.ok || 'OK') + '</button>' +
      (opt.cancel === false ? '' : '<button class="btn" data-dlg="cancel">' + esc(opt.cancel || 'Cancelar') + '</button>') +
      '</div></div></div>';
    function onClick(e) {
      var b = e.target.closest('[data-dlg]');
      if (!b) return;
      root.removeEventListener('click', onClick);
      root.innerHTML = '';
      resolve(b.dataset.dlg === 'ok');
    }
    root.addEventListener('click', onClick);
  });
}
function notice(title, text) { return askConfirm({ title: title, text: text, ok: 'OK', cancel: false }); }

/* ---------- Sheets ---------- */
function openSheet(html) {
  $('#sheet-root').innerHTML = '<div class="overlay" data-act="close"><div class="panel" data-act="noop">' + html + '</div></div>';
  document.body.classList.add('locked');
}
function closeSheet() { $('#sheet-root').innerHTML = ''; document.body.classList.remove('locked'); }

/* ---------- Render ---------- */
function render() {
  renderBanners();
  $('#view-list').hidden = view !== 'list';
  $('#view-cal').hidden = view !== 'cal';
  Array.prototype.forEach.call(document.querySelectorAll('#main-seg button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === view)); });
  Array.prototype.forEach.call(document.querySelectorAll('#sub-seg button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.f === filter)); });
  if (view === 'list') renderList(); else renderCal();
}

function needsBackup() {
  if (!db.loans.length) return false;
  var base = db.settings.lastBackup;
  if (!base) {
    var first = Math.min.apply(null, db.loans.map(function (l) { return l.createdAt || Date.now(); }));
    base = tsToISO(first);
  }
  return diffDays(base, todayISO()) >= 7;
}

function renderBanners() {
  var t = todayISO(), h = PREVIEW ? '<p class="note" style="margin:0 4px 12px">Pré-visualização dentro do Claude: os dados ficam só neste navegador e já vêm com exemplos. O Calendário e o backup só funcionam no app instalado no iPhone.</p>' : '';
  // Uma linha por pessoa (não por empréstimo). O alerta tem altura limitada: com mais de 4 pessoas,
  // mostra as 3 mais antigas e um botão que abre a lista filtrada só com os atrasados.
  var groups = lateGroups(t), n = groups.length;
  if (n) {
    var cap = n > 4 ? 3 : n, sum = 0;
    groups.forEach(function (g) { sum += g.total; });
    h += '<div class="card alert"><p class="alert-title alert-head"><span>' + (n === 1 ? '1 pessoa para cobrar' : n + ' pessoas para cobrar') + '</span>' + (n > 1 ? '<span>' + brl(sum) + '</span>' : '') + '</p>';
    h += groups.slice(0, cap).map(function (g) {
      var l = g.loans[0], d = diffDays(reminderDate(l.date), t);
      var when = d === 0 ? 'lembrete de hoje' : 'lembrete há ' + d + (d === 1 ? ' dia' : ' dias');
      var sub = g.loans.length > 1 ? g.loans.length + ' empréstimos · ' + (d === 0 ? 'hoje' : 'há ' + d + (d === 1 ? ' dia' : ' dias')) : when + ' · vence ' + fmtShort(dueDate(l.date));
      return '<button class="row-btn" data-act="detail" data-id="' + l.id + '"><span>' + esc(fullName(l)) + '<small>' + sub + '</small></span><b>' + brl(g.total) + '</b></button>';
    }).join('');
    if (n > cap) h += '<button class="more-btn" data-act="late-all">+ ' + (n - cap) + ' outros · ver todos</button>';
    h += '</div>';
  }
  if (needsBackup()) {
    h += '<div class="card soft"><p>Faz mais de uma semana desde o último backup. Se o iPhone for perdido ou o Safari limpar os dados, tudo some.</p><button class="btn" data-act="backup">Fazer backup agora</button></div>';
  }
  $('#banners').innerHTML = h;
}

function renderList() {
  var act = filter === 'active', t = todayISO();
  var all = db.loans.filter(function (l) { return act ? l.status !== 'paid' : l.status === 'paid'; });
  function isLate(l) { return reminderDate(l.date) <= t; }
  if (lateOnly && !(act && all.some(isLate))) lateOnly = false;   // nada mais atrasado: sai do filtro
  var loans = (act && lateOnly) ? all.filter(isLate) : all;
  var tokens = normName(query) ? normName(query).split(' ') : [];
  if (tokens.length) loans = loans.filter(function (l) {
    var n = normName(fullName(l));
    return tokens.every(function (k) { return n.indexOf(k) >= 0; });
  });
  // a busca fica visível assim que há algo para procurar (some só com a aba vazia e nada digitado)
  $('#search').hidden = !(all.length || query);
  $('#search .clear').hidden = !query;
  loans.sort(act ? byReminder : function (a, b) { return (b.paidAt || '').localeCompare(a.paidAt || ''); });
  var el = $('#list');
  var pill = (act && lateOnly) ? '<button class="pill" data-act="late-off">Só atrasados ✕</button>' : '';
  if (!loans.length) {
    el.innerHTML = pill + '<div class="empty">' + (tokens.length
      ? 'Nenhum resultado para “' + esc(query.trim()) + '”.'
      : act
        ? 'Nenhum empréstimo em aberto.<br>Toque em <b>Novo empréstimo</b> para começar.'
        : 'Nenhum empréstimo quitado ainda.') + '</div>';
    return;
  }
  var sumP = 0, sumJ = 0;
  var rows = loans.map(function (l) {
    var jur = loanInterest(l); sumP += l.valor; sumJ += jur;
    var cell, cls = '';
    if (act) { var r = reminderDate(l.date); cell = fmtShort(r); cls = r < t ? 'late' : (r === t ? 'today' : ''); }
    else cell = l.paidAt ? fmtShort(l.paidAt) : '—';
    return '<tr data-act="detail" data-id="' + l.id + '"><td class="name">' + esc(fullName(l)) + '</td><td>' + num(l.valor) + '</td><td>' + num(jur) + '</td><td class="' + cls + '">' + cell + '</td></tr>';
  }).join('');
  el.innerHTML = pill + '<div class="card"><table><thead><tr><th>Nome</th><th>Emprestado</th><th>Juros ' + RATE + '%</th><th>' + (act ? 'Lembrete' : 'Pago em') + '</th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td>Total · ' + loans.length + '</td><td>' + num(sumP) + '</td><td>' + num(sumJ) + '</td><td></td></tr></tfoot></table></div>' +
    '<p class="note">Valores em reais (R$). Toque em uma linha para ver os detalhes.</p>';
}

function renderCal() {
  var y = calM.y, m = calM.m, t = todayISO();
  var first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
  var map = {};
  db.loans.filter(function (l) { return l.status !== 'paid'; }).forEach(function (l) {
    var r = reminderDate(l.date); (map[r] = map[r] || []).push(l);
  });
  var cells = '';
  for (var i = 0; i < first; i++) cells += '<span class="cell empty"></span>';
  for (var d = 1; d <= dim; d++) {
    var k = isoDate(y, m, d), n = (map[k] || []).length;
    var tone = k < t ? 'late' : (k === t ? 'today' : '');
    cells += '<button class="cell' + (k === t ? ' today' : '') + (k === calSel ? ' sel' : '') + '" data-act="cal-day" data-d="' + k + '"><span>' + d + '</span>' +
      (n ? '<i class="dot ' + tone + '">' + n + '</i>' : '<i class="dot ph">0</i>') + '</button>';
  }
  var prefix = y + '-' + pad(m) + '-', cnt = 0, sum = 0, pend = 0;
  Object.keys(map).forEach(function (k) { if (k.indexOf(prefix) === 0) map[k].forEach(function (l) { cnt++; sum += loanTotal(l); pend += loanInterest(l); }); });
  // juros do mês: já recebidos (empréstimos quitados dentro do mês) + ainda a receber (lembretes do mês)
  var got = 0;
  db.loans.forEach(function (l) { if (l.status === 'paid' && l.paidAt && l.paidAt.indexOf(prefix) === 0) got += loanInterest(l); });
  var monthName = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long' });
  var title = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  var dayLoans = map[calSel] || [];
  var dow = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(function (x) { return '<span class="dow">' + x + '</span>'; }).join('');
  $('#cal').innerHTML =
    '<div class="cal-head"><button class="icon-btn" data-act="cal-prev" aria-label="Mês anterior">‹</button><h2>' + esc(title) + '</h2><div class="grp"><button class="top-btn" data-act="cal-today">Hoje</button><button class="icon-btn" data-act="cal-next" aria-label="Próximo mês">›</button></div></div>' +
    '<div class="card pad earn"><div class="earn-main"><span>Juros de ' + esc(monthName) + '</span><b>' + brl(got + pend) + '</b></div>' +
    '<div class="earn-parts"><div><span>Já recebidos</span><b>' + brl(got) + '</b></div><div><span>A receber</span><b>' + brl(pend) + '</b></div></div></div>' +
    '<div class="cal-grid">' + dow + cells + '</div>' +
    '<p class="month-sum">' + (cnt ? cnt + (cnt === 1 ? ' lembrete' : ' lembretes') + ' neste mês · ' + brl(sum) + ' a receber' : 'Nenhum lembrete neste mês.') + '</p>' +
    '<div class="card pad"><h3>' + esc(fmtLong(calSel)) + '</h3>' +
    (dayLoans.length ? dayLoans.map(function (l) {
      return '<button class="row-btn" data-act="detail" data-id="' + l.id + '"><span>' + esc(fullName(l)) + '<small>emprestado ' + brl(l.valor) + '</small></span><b>' + brl(loanTotal(l)) + '</b></button>';
    }).join('') : '<p class="muted" style="margin:0">Nenhum lembrete neste dia.</p>') + '</div>';
}

function moveMonth(delta) {
  var m = calM.m + delta, y = calM.y;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  calM = { y: y, m: m };
  var t = new Date();
  calSel = (t.getFullYear() === y && t.getMonth() + 1 === m) ? todayISO() : isoDate(y, m, 1);
  renderCal();
}

/* ---------- Formulário ---------- */
function openForm(id, pre) {
  var l = id ? find(id) : null, v = l || pre || {};
  var html =
    '<form id="loan-form" novalidate data-id="' + (l ? l.id : '') + '" data-taxa="' + (l && l.taxa != null ? l.taxa : RATE) + '">' +

    (l ? '' : '<p class="help" id="prefill-note"' + (pre ? '' : ' hidden') + '>Dados preenchidos a partir do último empréstimo. Confira o valor e a data.</p>') +
    '<div class="grid2">' +
      '<label>Nome<input name="nome" autocomplete="off" autocapitalize="words" value="' + esc(v.nome) + '"></label>' +

    '<label>Telefone<input name="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="(00) 00000-0000" data-mask="phone" value="' + esc(v.phone) + '"></label>' +
    '<label>Endereço<input name="endereco" autocomplete="off" autocapitalize="words" value="' + esc(v.endereco) + '"></label>' +
    '<label>Profissão<input name="profissao" autocomplete="off" autocapitalize="sentences" value="' + esc(v.profissao) + '"></label>' +
    '<label>Indicado por<input name="indicacao" autocomplete="off" autocapitalize="words" placeholder="Buscar ou escrever um nome" value="' + esc(v.indicacao) + '"></label>' +
    '<div id="suggest-ind"></div>' +
    '<label>Salário mensal (R$)<input name="salario" inputmode="numeric" autocomplete="off" placeholder="0,00" data-mask="money" data-cents="' + (v.salario || 0) + '" value="' + (v.salario ? num(v.salario) : '') + '"></label>' +
    '<div class="loan-box">' +
      '<label>Valor emprestado (R$)<input name="valor" inputmode="numeric" autocomplete="off" placeholder="0,00" data-mask="money" data-cents="' + (v.valor || 0) + '" value="' + (v.valor ? num(v.valor) : '') + '"></label>' +
      '<label>Data do empréstimo<input name="date" type="date" value="' + esc(v.date || todayISO()) + '"></label>' +
      '<p class="preview" id="preview"></p>' +
    '</div>' +
    (l ? '<p class="help">Se você mudar o valor ou a data, adicione o lembrete ao Calendário de novo para atualizar o aviso.</p>' : '') +
    '<p class="err" id="form-err" role="alert"></p>' +
    '<button class="btn primary" type="submit">Salvar</button>' +
    '</form>';
  openSheet(html);
  updatePreview();
}

function centsOf(inp) { return parseInt(inp.dataset.cents || '0', 10) || 0; }
function setMoney(inp, c) { inp.dataset.cents = c || 0; inp.value = c ? num(c) : ''; }

// Sugestões de pessoas já conhecidas (inclui quem tem tudo quitado) enquanto digita o nome
function renderSuggest() {
  var f = $('#loan-form'), box = $('#suggest'); if (!f || !box) return;
  var q = normName(f.elements.nome.value + ' ' + f.elements.sobrenome.value);
  if (q.length < 2) { box.innerHTML = ''; return; }
  var tokens = q.split(' ');
  var found = peopleList().filter(function (p) {
    var n = normName(fullName(p.last));
    return tokens.every(function (k) { return n.indexOf(k) >= 0; });
  }).sort(function (a, b) { return byDateDesc(a.last, b.last); }).slice(0, 5);
  box.innerHTML = (found.length ? '<p class="help" style="margin:0 0 6px">Já cadastrado? Toque para preencher os dados:</p>' : '') + found.map(function (p) {
    var open = p.loans.filter(function (x) { return x.status !== 'paid'; }).length;
    var sub = open ? (open === 1 ? '1 em aberto' : open + ' em aberto') : 'tudo quitado';
    return '<button type="button" class="row-btn sug" data-act="pick" data-key="' + esc(p.key) + '"><span>' + esc(fullName(p.last)) +
      '<small>' + sub + ' · último ' + brl(p.last.valor) + ' em ' + fmtShort(p.last.date) + '</small></span></button>';
  }).join('');
}

function pickPerson(key) {
  var f = $('#loan-form'); if (!f) return;
  var p = peopleList().filter(function (x) { return x.key === key; })[0]; if (!p) return;
  var pre = prefillFor(p), el = f.elements;
  el.nome.value = pre.nome || ''; el.sobrenome.value = pre.sobrenome || '';
  el.cpf.value = pre.cpf || ''; el.phone.value = pre.phone || '';
  el.endereco.value = pre.endereco || ''; el.profissao.value = pre.profissao || '';
  el.indicacao.value = pre.indicacao || '';
  setMoney(el.salario, pre.salario); setMoney(el.valor, pre.valor);
  $('#suggest').innerHTML = ''; $('#suggest-ind').innerHTML = '';
  var note = $('#prefill-note'); if (note) note.hidden = false;
  updatePreview();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

// "Indicado por": propõe clientes já cadastrados e nomes já usados como indicação, pelas primeiras letras de
// qualquer palavra do nome. Um nome novo é livre: se nada combina, fica como foi digitado.
function renderSuggestInd() {
  var f = $('#loan-form'), box = $('#suggest-ind'); if (!f || !box) return;
  var q = normName(f.elements.indicacao.value);
  if (!q) { box.innerHTML = ''; return; }
  var self = normName(f.elements.nome.value + ' ' + f.elements.sobrenome.value);   // ninguém indica a si mesmo
  var seen = {}, names = [];
  function add(name) { var k = normName(name); if (!k || seen[k]) return; seen[k] = true; names.push(name); }
  peopleList().forEach(function (p) { add(fullName(p.last)); });
  db.loans.forEach(function (l) { add(l.indicacao); });
  var tokens = q.split(' ');
  var found = names.filter(function (n) {
    var k = normName(n);
    return k !== q && k !== self && tokens.every(function (t) { return (' ' + k).indexOf(' ' + t) >= 0; });
  }).sort(function (a, b) { var x = normName(a), y = normName(b); return x < y ? -1 : x > y ? 1 : 0; }).slice(0, 5);
  if (found.length) {
    box.innerHTML = found.map(function (n) {
      return '<button type="button" class="row-btn sug" data-act="pick-ind" data-name="' + esc(n) + '"><span>' + esc(n) + '</span></button>';
    }).join('');
  } else if (q.length >= 2 && !names.some(function (n) { return normName(n) === q; })) {

function maskCPF(v) {
  var d = v.replace(/\D/g, '').slice(0, 11), o = d.slice(0, 3);
  if (d.length > 3) o += '.' + d.slice(3, 6);
  if (d.length > 6) o += '.' + d.slice(6, 9);
  if (d.length > 9) o += '-' + d.slice(9, 11);
  return o;
}
function maskPhone(v, pasted) {
  var d = v.replace(/\D/g, '');
  // Número colado do WhatsApp vem com o código do país (+55 11 91234-5678): tira o 55 antes da máscara.
  // 13 dígitos ou mais só podem vir de uma colagem. Com 12 (fixo com +55) só tira se veio colado ou com "+",
  // para não confundir com quem digita um 12º dígito num número de DDD 55.
  if (d.slice(0, 2) === '55' && (d.length > 12 || (d.length === 12 && (pasted || /^\D*\+/.test(v))))) d = d.slice(2);
  d = d.slice(0, 11);
  if (!d) return '';
  if (d.length <= 2) return '(' + d;
  var split = d.length > 10 ? 7 : 6;
  var o = '(' + d.slice(0, 2) + ') ' + d.slice(2, split);
  if (d.length > split) o += '-' + d.slice(split);
  return o;
}

/* ---------- Festa ao quitar: fogos de artifício de 🤑💰💸 e a foto ---------- */
var WIN_EMOJI = ['🤑', '💰', '💸'], WIN_SPARK = ['#ffe066', '#ffffff', '#ffb938', '#9fe8ff'];
var winTimers = [];
function rnd(a, b) { return a + Math.random() * (b - a); }
function closeWin() {
  var el = document.getElementById('win'); if (!el) return;
  winTimers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
  winTimers = [];
  el.classList.add('out');
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 380);
}
function fireworkAt(sky, x, y) {
  var fw = document.createElement('div'), i, a, d, c, n = 13;
  fw.className = 'fw'; fw.style.left = Math.round(x) + 'px'; fw.style.top = Math.round(y) + 'px';
  var h = '<i class="fw-rocket" style="--rise:' + Math.round(sky.clientHeight - y) + 'px"></i><i class="fw-flash"></i>';
  for (i = 0; i < n; i++) {                                         // os emojis que explodem em círculo
    a = (i / n) * Math.PI * 2 + rnd(-.18, .18); d = rnd(80, 150);
    h += '<i class="fw-e" style="font-size:' + Math.round(rnd(24, 38)) + 'px;--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) +
      'px;--r:' + Math.round(rnd(-220, 220)) + 'deg">' + WIN_EMOJI[Math.floor(Math.random() * 3)] + '</i>';
  }
  for (i = 0; i < 18; i++) {                                        // faíscas douradas, para parecer fogos de verdade
    a = rnd(0, Math.PI * 2); d = rnd(40, 125); c = WIN_SPARK[i % WIN_SPARK.length];
    h += '<i class="fw-s" style="--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d) + 'px;background:' + c + ';box-shadow:0 0 6px ' + c + '"></i>';
  }
  fw.innerHTML = h; sky.appendChild(fw);
  setTimeout(function () { if (fw.parentNode) fw.parentNode.removeChild(fw); }, 3400);
}
function celebrate(l) {
  closeWin();
  var old = document.getElementById('win'); if (old && old.parentNode) old.parentNode.removeChild(old);
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var el = document.createElement('div');
  el.id = 'win'; el.className = 'win' + (calm ? ' calm' : '');
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Empréstimo quitado');
  el.innerHTML =
    '<div class="win-sky"></div>' +
    '<div class="win-card">' +
      '<div class="win-photo"><img src="vitoria.jpg" alt=""></div>' +

  el.addEventListener('click', function () { if (Date.now() - shownAt > 600) closeWin(); });
  if (navigator.vibrate) navigator.vibrate([40, 50, 40, 50, 120]);
  if (!calm) {
    var sky = el.querySelector('.win-sky'), W = sky.clientWidth, H = sky.clientHeight;
    [[.2, .24], [.8, .2], [.5, .1], [.14, .58], [.86, .52], [.5, .46]].forEach(function (p, k) {   // primeira salva
      winTimers.push(setTimeout(function () { fireworkAt(sky, p[0] * W, p[1] * H); }, 150 + k * 260));
    });
    winTimers.push(setTimeout(function () {                           // depois, fogos em lugares aleatórios
      winTimers.push(setInterval(function () { fireworkAt(sky, rnd(.12, .88) * W, rnd(.1, .62) * H); }, 600));
    }, 1900));
  }

/* ---------- Lembrete no Calendário (.ics) ---------- */
function icsEscape(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}
function foldLine(line) {
  var out = [], s = line;
  while (s.length > 74) { out.push(s.slice(0, 74)); s = ' ' + s.slice(74); }
  out.push(s);
  return out.join('\r\n');
}
function plain(s) { return s.replace(/\u00a0/g, ' '); }
function makeICS(l) {
  var r = parseISO(reminderDate(l.date)), h = db.settings.reminderHour;
  var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  var day = '' + r.y + pad(r.m) + pad(r.d);
  var title = 'Cobrar ' + fullName(l) + ' — ' + plain(brl(loanTotal(l)));
  var desc = ['Valor a receber: ' + plain(brl(loanTotal(l))),
    'Emprestado: ' + plain(brl(l.valor)) + ' em ' + fmtFull(l.date),
    'Vencimento: ' + fmtFull(dueDate(l.date))];
  if (l.phone) desc.push('Telefone: ' + l.phone);
  var lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Emprestimos//PT-BR//', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:' + l.id + '-lembrete@emprestimos.local',
    'DTSTAMP:' + stamp,
    'DTSTART:' + day + 'T' + pad(h) + '0000',
    'DTEND:' + day + 'T' + pad(h) + '3000',
    'SUMMARY:' + icsEscape(title),
    'DESCRIPTION:' + icsEscape(desc.join('\n')),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(title), 'TRIGGER:PT0S', 'END:VALARM',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(title), 'TRIGGER:-PT1H', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ];
  return lines.map(foldLine).join('\r\n') + '\r\n';
}
function slug(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'cliente';
}
/* ---------- Lembrete no Calendário do iPhone ---------- */
// O texto do lembrete vai codificado no endereço; o service worker (sw.js) o devolve como arquivo .ics de verdade,
// sem sair do aparelho. É isso que faz o iPhone abrir a tela "Adicionar ao Calendário".
function icsToB64(text) {
  var bytes = new TextEncoder().encode(text), bin = '';
  bytes.forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function calLink(l, kind) {
  var href = 'lembrete.ics?c=' + icsToB64(makeICS(l));
  if (kind === 'alt') return '<a class="btn link" data-act="cal-add" data-id="' + l.id + '" download="lembrete-' + slug(fullName(l)) + '.ics" href="' + esc(href) + '">Não abriu? Tente outra forma</a>';
  return '<a class="btn' + (kind === 'primary' ? ' primary' : '') + '" data-act="cal-add" data-id="' + l.id + '" href="' + esc(href) + '">' + (l.calAt ? 'Adicionar de novo ao Calendário' : 'Adicionar lembrete ao Calendário') + '</a>';
}
// Antes de seguir o link, confirma que o service worker está ativo: se não estiver, o endereço (com nome e telefone) iria para a internet.
function calGuard(e, id) {
  if (PREVIEW) {
    e.preventDefault();
    notice('Indisponível aqui', 'Na pré-visualização dentro do Claude o Calendário não abre. Esta função só vale no app instalado na tela inicial do iPhone.');
  } else if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
    e.preventDefault();
    notice('Quase pronto', 'Feche o app por completo (deslize para cima no seletor de apps), abra de novo e toque neste botão outra vez.');
  } else {
    calStart(id);
  }
}

// O iPhone abre a tela do Calendário por cima do app e não avisa quando ela é fechada (nem se tocou em "Adicionar" ou no X).
// Então: logo depois do toque, a tela de baixo já troca para "Lembrete adicionado"; quando o app volta a receber toque ou foco,
// toca a animação de confirmação e a tela se fecha sozinha.
var calPending = null, calSwallowUntil = 0;
var CAL_EVENTS = [['visibilitychange', document], ['pageshow', window], ['focus', window]];
var CAL_TOUCH = ['pointerdown', 'touchstart', 'keydown'];

function calDoneHtml(l, mode) {
  return '<div class="done ' + mode + '"><svg class="ck" viewBox="0 0 52 52" aria-hidden="true"><circle class="ck-ring" cx="26" cy="26" r="24"/><circle class="ck-c" cx="26" cy="26" r="24"/><path class="ck-p" d="M15 27l8 8 14-16"/></svg>' +
    '<h2>Lembrete adicionado</h2><p class="muted">O aviso toca em <b>' + esc(fmtLong(reminderDate(l.date))) + '</b>, às ' + pad(db.settings.reminderHour) + ':00.</p></div>';
}
function calStart(id) {
  if (calPending) return;
  calPending = { id: id, t: Date.now(), armed: false };
  setTimeout(calShowDone, 400);
}
function calShowDone() {
  var c = calPending; if (!c) return;
  var l = find(c.id), p = $('#sheet-root .panel');
  if (!l || !p) { calPending = null; return; }
  l.calAt = todayISO(); save();
  p.innerHTML = calDoneHtml(l, 'wait');   // tela vazia enquanto o Calendário está aberto: a confirmação só aparece na volta
  c.armed = true;
  CAL_EVENTS.forEach(function (x) { x[1].addEventListener(x[0], calReturned, true); });
  CAL_TOUCH.forEach(function (n) { document.addEventListener(n, calReturned, true); });
  c.last = Date.now(); c.focus = document.hasFocus ? document.hasFocus() : true;
  c.timer = setInterval(function () {
    var now = Date.now(), hf = document.hasFocus ? document.hasFocus() : true;
    var back = (!c.focus && hf) || now - c.last > 1500;
    c.last = now; c.focus = hf;
    if (back) calReturned({ type: 'poll' });
  }, 300);
}
function calReturned(e) {
  var c = calPending; if (!c || !c.armed) return;
  if (e.type === 'visibilitychange' && document.visibilityState !== 'visible') return;
  if (Date.now() - c.t < 1200) return;   // ainda é a abertura da tela do Calendário
  CAL_EVENTS.forEach(function (x) { x[1].removeEventListener(x[0], calReturned, true); });
  CAL_TOUCH.forEach(function (n) { document.removeEventListener(n, calReturned, true); });
  clearInterval(c.timer);
  calPending = null;
  calSwallowUntil = Date.now() + 700;    // o toque que trouxe o app de volta não deve fechar a tela antes da animação
  var l = find(c.id), p = $('#sheet-root .panel');
  if (!l || !p) { render(); return; }
  p.innerHTML = calDoneHtml(l, 'play');
  setTimeout(function () { closeSheet(); render(); }, 1800);
}

function openSettings() {

    '<label>Hora do aviso no Calendário<select id="hour-select">' + hours + '</select></label>' +

    '<div class="stack"><button class="btn primary" data-act="backup">Fazer backup</button>' +
    '<label class="btn" style="margin:0">Restaurar backup<input id="import-file" type="file" accept=".json,application/json" hidden></label></div></div>');

async function doBackup() {
  if (PREVIEW) { notice('Indisponível aqui', 'Na pré-visualização dentro do Claude o backup não pode ser salvo. Esta função só vale no app instalado na tela inicial do iPhone.'); return; }
  var text = JSON.stringify(db, null, 2), name = 'caixa-salva-backup-' + todayISO() + '.json';
  var done = false;
  try {
    var file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      done = true;
    }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  if (!done) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }
  db.settings.lastBackup = todayISO(); save(); render();
  if ($('#hour-select')) openSettings();
  toast('Backup feito');
}

function importBackup(file) {
  var r = new FileReader();
  r.onload = async function () {
    var p;
    try {
      p = JSON.parse(r.result);
      var ok = p && Array.isArray(p.loans) && p.loans.every(function (l) {
        return l && typeof l.id === 'string' && Number.isInteger(l.valor) && /^\d{4}-\d{2}-\d{2}$/.test(l.date || '');
      });
      if (!ok) throw new Error('invalid');
    } catch (e) { notice('Arquivo inválido', 'Esse arquivo não é um backup deste app.'); return; }
    var go = await askConfirm({ title: 'Restaurar este backup?', text: 'Os dados deste aparelho serão substituídos por ' + p.loans.length + ' empréstimo(s) do arquivo.', ok: 'Restaurar', danger: true });
    if (!go) return;
    db = { version: 1, loans: p.loans, settings: Object.assign({ reminderHour: 9, lastBackup: null }, p.settings || {}) };
    save(); closeSheet(); render(); toast('Backup restaurado');
  };
  r.readAsText(file);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', function (e) {
  if (Date.now() < calSwallowUntil) { e.preventDefault(); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'noop': return;
    case 'close': closeSheet(); break;
    case 'new': openForm(); break;
    case 'new-for': var src = find(id); if (src) openForm(null, prefillFor(personOf(src))); break;
    case 'pick': pickPerson(el.dataset.key); break;
    case 'pick-ind': pickIndicacao(el.dataset.name); break;
    case 'detail': openDetail(id); break;
    case 'edit': openForm(id); break;
    case 'view': view = el.dataset.v; render(); break;
    case 'filter': filter = el.dataset.f; lateOnly = false; render(); break;
    case 'late-all':
      view = 'list'; filter = 'active'; lateOnly = true; query = ''; $('#q').value = ''; render();
      var sub = $('#sub-seg'); if (sub && sub.scrollIntoView) sub.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    case 'late-off': lateOnly = false; render(); break;
    case 'q-clear': query = ''; $('#q').value = ''; renderList(); $('#q').focus(); break;
    case 'pay': payLoan(id); break;
    case 'reopen': var l = find(id); if (l) { l.status = 'active'; l.paidAt = null; save(); closeSheet(); render(); toast('Empréstimo reaberto'); } break;
    case 'delete':
      askConfirm({ title: 'Excluir este empréstimo?', text: 'Isso não pode ser desfeito.', ok: 'Excluir', danger: true }).then(function (yes) {
        if (!yes) return;
        db.loans = db.loans.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); toast('Excluído');
      });
      break;
    case 'cal-add': calGuard(e, id); break;
    case 'cal-prev': moveMonth(-1); break;
    case 'cal-next': moveMonth(1); break;
    case 'cal-today': var t = new Date(); calM = { y: t.getFullYear(), m: t.getMonth() + 1 }; calSel = todayISO(); renderCal(); break;
    case 'cal-day': calSel = el.dataset.d; renderCal(); break;
    case 'settings': openSettings(); break;
    case 'backup': doBackup(); break;
  }
});

document.addEventListener('submit', function (e) {
  if (e.target.id === 'loan-form') { e.preventDefault(); submitForm(e.target); }
});

document.addEventListener('input', function (e) {
  var t = e.target, m = t.dataset && t.dataset.mask;
  if (t.id === 'q') { query = t.value; renderList(); return; }
  if (m === 'money') {
    var d = t.value.replace(/\D/g, '').slice(0, 12), c = d ? parseInt(d, 10) : 0;
    t.dataset.cents = c; t.value = d ? num(c) : '';
  } else if (m === 'cpf') t.value = maskCPF(t.value);
  else if (m === 'phone') t.value = maskPhone(t.value, e.inputType === 'insertFromPaste');
  if (t.closest && t.closest('#loan-form')) {
    updatePreview(); var er = $('#form-err'); if (er) er.textContent = '';
    if (t.name === 'nome' || t.name === 'sobrenome') renderSuggest();
    if (t.name === 'indicacao') renderSuggestInd();
  }
});

document.addEventListener('change', function (e) {
  if (e.target.id === 'hour-select') {
    db.settings.reminderHour = parseInt(e.target.value, 10); save();
    toast('Aviso às ' + pad(db.settings.reminderHour) + ':00');
  } else if (e.target.id === 'import-file' && e.target.files[0]) {
    importBackup(e.target.files[0]);
  } else if (e.target.closest && e.target.closest('#loan-form')) updatePreview();
});

document.addEventListener('visibilitychange', function () { if (!document.hidden && !$('.overlay')) render(); });

/* ---------- Início ---------- */
load();
(function () { var t = new Date(); calM = { y: t.getFullYear(), m: t.getMonth() + 1 }; calSel = todayISO(); })();
render();
(new Image()).src = 'vitoria.jpg';   // já carregada quando chegar a hora da festa
if (!PREVIEW && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
</script>
